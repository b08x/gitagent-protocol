# Gitagent Protocol Workflow Documentation Refresh Or Rebrand

## Action

Follow the documentation-refresh-or-rebrand workflow:
1. Update package.json and package-lock.json with new name, version, description, and repository fields.
2. Update CLI self-name and version in src/index.ts and related command files.
3. Update all documentation files (README.md, docs.md, CONTRIBUTING.md, paper, etc.) to reflect new names and features.
4. Update .github/workflows as needed for publishing or CI changes.
5. Update example READMEs and inline code references.
6. Preserve historical notes for migration/compatibility.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: package.json, package-lock.json, src/index.ts

