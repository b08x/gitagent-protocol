# Gitagent Protocol Workflow Add Or Update Schema Backed Feature

## Action

Follow the add-or-update-schema-backed-feature workflow:
1. Edit or add the relevant section in spec/schemas/agent-yaml.schema.json to define the schema.
2. Update or add example YAML in examples/ (e.g., examples/full/agent.yaml or a new example directory).
3. Update SPECIFICATION.md to document the new feature and its validation rules.
4. Update implementation code to support the new schema (e.g., src/adapters/shared.ts, src/commands/validate.ts).
5. Add or update TypeScript types/interfaces as needed (e.g., src/utils/loader.ts).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: spec/schemas/agent-yaml.schema.json, examples/*/agent.yaml, spec/SPECIFICATION.md

